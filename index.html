<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPWedding | Find Your Table</title><style>
:root{--wine:#792b42;--cream:#faf4eb;--gold:#c5a47d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#34272b;font-family:system-ui,'Tahoma',sans-serif}.wrap{max-width:960px;margin:auto;padding:24px 14px 60px}header{text-align:center;padding:22px 0}header .monogram{font-family:Georgia,serif;color:var(--wine);font-size:38px}h1{font-family:Georgia,serif;color:var(--wine);margin:8px 0;font-weight:500}p{line-height:1.6}.panel{background:white;border:1px solid #e9ddd0;border-radius:18px;padding:20px;box-shadow:0 5px 24px #552b3210;margin-bottom:18px}.search{display:flex;gap:10px}input{font:inherit;padding:13px 15px;border:1px solid #d7c8bd;border-radius:9px;flex:1;min-width:0}button{font:inherit;background:var(--wine);color:white;border:0;padding:12px 20px;border-radius:9px;cursor:pointer}button:hover{filter:brightness(1.12)}#result{text-align:center;min-height:32px;margin-top:14px}#result strong{color:var(--wine);font-size:24px}.sub{color:#7d6b6e;font-size:14px}.map{position:relative;width:100%;aspect-ratio:760/740;max-width:650px;margin:auto;background:#fffaf3;border:2px solid #d9c5b2;border-radius:12px;overflow:hidden}.stage{position:absolute;left:11%;top:2%;width:78%;height:7%;background:#ead8c9;border:2px solid var(--gold);border-radius:6px;display:grid;place-items:center;color:var(--wine);font-weight:700}.aisle{position:absolute;left:42%;width:16%;top:9%;bottom:5%;background:#f0e4d6;border-left:2px dashed #c9b6a0;border-right:2px dashed #c9b6a0;display:grid;place-items:center}.aisle span{writing-mode:vertical-rl;color:#92775d;letter-spacing:2px}.door{position:absolute;bottom:1%;left:42%;width:16%;height:4%;border:2px solid #be8858;border-radius:4px;text-align:center;background:#fff5e8;color:#875332;font-size:clamp(9px,1.9vw,14px);display:grid;place-items:center}.table{position:absolute;left:var(--x);top:var(--y);width:14.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--wine);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(12px,2.5vw,19px);color:var(--wine);font-weight:700;transition:.2s;z-index:2}.table.active{background:var(--wine);color:white;border-color:#d7b77f;box-shadow:0 0 0 6px #d7b77f70;transform:translate(-50%,-50%) scale(1.12)}.map-title{text-align:center;color:var(--wine);margin:4px 0 15px}.choices{display:grid;gap:9px;max-width:520px;margin:12px auto 0}.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:#fffaf6;color:var(--wine);border:1px solid #d7c0b2;text-align:left}.choice:hover,.choice:focus-visible{background:#f7e9e8;outline:2px solid var(--gold)}.choice small{color:#75666a}details{margin-top:18px}summary{cursor:pointer;color:var(--wine)}textarea{width:100%;min-height:140px;border:1px solid #d7c8bd;border-radius:9px;padding:12px;font:14px monospace}code{background:#f8f0e8;padding:2px 5px;border-radius:4px}@media(max-width:520px){.wrap{padding:10px 10px 40px}.panel{padding:14px}.search{flex-direction:column}.table{border-width:2px}.map{aspect-ratio:760/820}.stage{font-size:13px}}</style></head><body><main class="wrap"><header><div class="monogram">BPWedding</div><h1>Find Your Table</h1><p>ยินดีต้อนรับสู่ BPWedding<br>ค้นหาชื่อของคุณเพื่อดูหมายเลขโต๊ะ</p></header><section class="panel"><form class="search" id="searchForm"><input id="guestName" placeholder="พิมพ์ชื่อ หรือชื่อ-นามสกุล" autocomplete="name" required><button type="submit">ค้นหาโต๊ะ</button></form><div id="result" role="status" aria-live="polite" class="sub">กำลังโหลดรายชื่อแขกจาก guests.csv…</div></section><section class="panel"><h2 class="map-title">แผนผังโต๊ะจีน • 12 โต๊ะ</h2><div class="map" id="map"><div class="stage">เวที / STAGE</div><div class="aisle"><span>ทางเดินกลาง</span></div><div class="door">ประตูทางเข้า</div></div><p class="sub" style="text-align:center">โต๊ะฝั่งซ้ายเลขคี่ • ฝั่งขวาเลขคู่ • จัดวางสลับเยื้องตามผังที่กำหนด</p></section></main><script>
// โหลดรายชื่อจาก guests.csv ที่อยู่โฟลเดอร์เดียวกับ index.html
let guests=[];
let loaded=false;
const status=document.getElementById('result');
function normalize(s){return s.toLocaleLowerCase().replace(/[\s.\-]/g,'').trim()}
function parseCSV(text){
  const rows=[];let row=[],field='',quoted=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(quoted && text[i+1]==='"'){field+='"';i++}else quoted=!quoted}
    else if(c===',' && !quoted){row.push(field);field=''}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field=''}
    else field+=c;
  }
  if(field||row.length){row.push(field);rows.push(row)}
  if(rows.length && /^(name|ชื่อ|ชื่อแขก)$/i.test(rows[0][0].trim()))rows.shift();
  return rows.map(r=>({name:(r[0]||'').trim(),table:Number((r[1]||'').trim())}))
    .filter(g=>g.name && Number.isInteger(g.table) && g.table>=1 && g.table<=12);
}
async function loadGuests(){
  try{
    const response=await fetch('./guests.csv?v='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    guests=parseCSV(await response.text());loaded=true;
    status.textContent=guests.length?'พร้อมค้นหา • โหลดรายชื่อ '+guests.length+' รายการแล้ว':'ไม่พบรายชื่อที่ถูกต้องใน guests.csv';
  }catch(error){
    status.textContent='โหลด guests.csv ไม่สำเร็จ กรุณาเปิดผ่าน GitHub Pages หรือเว็บเซิร์ฟเวอร์ และตรวจสอบว่าอัปโหลดไฟล์ guests.csv แล้ว';
    console.error('CSV loading error:',error);
  }
}
const coordinates={1:[28,23],2:[72,23],3:[13,35],4:[87,35],5:[28,47],6:[72,47],7:[13,59],8:[87,59],9:[28,71],10:[72,71],11:[13,85],12:[87,85]};
const map=document.getElementById('map');Object.entries(coordinates).forEach(([n,[x,y]])=>{const el=document.createElement('div');el.className='table';el.id='table-'+n;el.style.setProperty('--x',x+'%');el.style.setProperty('--y',y+'%');el.textContent=n<=2?'VIP '+n:n;el.setAttribute('aria-label',tableLabel(Number(n)));map.appendChild(el)});
function tableLabel(n){return n===1?'VIP 1':n===2?'VIP 2':'โต๊ะ '+n}
function clear(){document.querySelectorAll('.table').forEach(el=>el.classList.remove('active'))}
function showGuest(g){
  clear();
  const result=document.getElementById('result');
  result.replaceChildren();
  const welcome=document.createElement('div');welcome.textContent='ยินดีต้อนรับ '+g.name;
  const table=document.createElement('strong');table.textContent=g.table<=2?tableLabel(g.table):'โต๊ะหมายเลข '+g.table;
  const note=document.createElement('div');note.className='sub';note.textContent='ดูโต๊ะที่ไฮไลต์บนแผนผังด้านล่าง';
  result.append(welcome,table,note);
  document.getElementById('table-'+g.table).classList.add('active');
  document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});
}
document.getElementById('searchForm').addEventListener('submit',e=>{
  e.preventDefault();clear();
  const result=document.getElementById('result');result.replaceChildren();
  if(!loaded){result.textContent='ยังโหลดรายชื่อไม่สำเร็จ กรุณาตรวจสอบ guests.csv';return}
  const query=normalize(document.getElementById('guestName').value);
  if(!query){result.textContent='กรุณากรอกชื่อ';return}
  const matches=guests.filter(g=>normalize(g.name).includes(query));
  if(!matches.length){result.textContent='ไม่พบชื่อในรายชื่อ กรุณาติดต่อเจ้าหน้าที่ต้อนรับ';return}
  if(matches.length===1){showGuest(matches[0]);return}
  const heading=document.createElement('div');
  heading.textContent='พบ '+matches.length+' รายชื่อ กรุณาเลือกชื่อของคุณ';
  const choices=document.createElement('div');choices.className='choices';
  matches.forEach(g=>{
    const button=document.createElement('button');button.type='button';button.className='choice';
    const name=document.createElement('span');name.textContent=g.name;
    const table=document.createElement('small');table.textContent=tableLabel(g.table);
    button.append(name,table);
    button.addEventListener('click',()=>showGuest(g));
    choices.appendChild(button);
  });
  result.append(heading,choices);
});
loadGuests();
</script></body></html>
