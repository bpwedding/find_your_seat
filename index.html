<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#751f35"><title>B & P | Find Your Seat</title><style>:root{--wine:#751f35;--cream:#faf5ec;--ink:#302a2a;--gold:#b89161}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:24px 16px 70px}header{text-align:center;padding:28px 0 20px}.monogram{font-family:Georgia,serif;font-size:54px;color:var(--wine)}h1{font-family:Georgia,serif;font-size:28px;margin:8px}p{line-height:1.7}.muted{color:#776d68}.panel{background:#fff;border:1px solid #e9dcd0;border-radius:18px;padding:22px;box-shadow:0 6px 24px #4c23220b;margin:18px 0}label{font-weight:bold;display:block;margin-bottom:10px}input{width:100%;padding:15px;border-radius:10px;border:1px solid #d8c6bb;font-size:17px}button{border:0;background:var(--wine);color:white;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b89161}.search{display:flex;gap:10px}.search input{flex:1;min-width:0}.result{margin-top:18px;min-height:26px}.success{padding:16px;background:#f8edf0;border:1px solid #ead0d7;border-radius:12px}.table-num{font-size:32px;color:var(--wine);font-weight:bold}.hall{position:relative;background:#f3e9de;border:2px solid #c5b4a2;border-radius:12px;padding:20px 12px 12px;max-width:650px;margin:16px auto}.stage{margin:0 auto 26px;width:60%;background:#7c3147;color:white;border-radius:8px;padding:14px;text-align:center}.tables{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px 10px;justify-items:center;padding:8px 4px 24px}.seat{width:min(100%,105px);aspect-ratio:1;border-radius:50%;background:white;border:3px solid #d4bba5;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:#694d43;position:relative;transition:.2s}.seat::before{content:"";position:absolute;inset:-9px;border:2px dotted #d5c8bc;border-radius:50%}.seat.active{background:var(--wine);color:#fff;border-color:#cfa66c;box-shadow:0 0 0 7px #eac8cf;transform:scale(1.08)}.entrance{text-align:center;border-top:2px dashed #c3ab9a;padding:15px 0 2px;font-weight:bold}.legend{text-align:center;font-size:13px;color:#766e6b}.footer{text-align:center;color:#8a7773;font-size:13px;margin-top:26px}.hidden{display:none}@media(max-width:480px){.search{flex-direction:column}.seat{width:74px}.tables{gap:23px 5px}.panel{padding:16px}.monogram{font-size:45px}}</style></head><body><main class="wrap"><header><div class="monogram">B <span style="font-size:30px">&</span> P</div><h1>Find Your Seat</h1><p class="muted">ยินดีต้อนรับสู่งานมงคลสมรส<br>ค้นหาตำแหน่งโต๊ะของคุณได้ที่นี่</p></header><section class="panel"><label for="guest">กรอกชื่อหรือนามสกุลของคุณ</label><div class="search"><input id="guest" placeholder="เช่น สมชาย หรือ Somchai" autocomplete="name"><button id="find">ค้นหาที่นั่ง</button></div><div id="result" class="result" aria-live="polite"><span class="muted">พิมพ์ชื่อแล้วกดค้นหาเพื่อดูหมายเลขโต๊ะ</span></div></section><section class="panel"><h2 style="text-align:center;color:var(--wine)">แผนผังโต๊ะจีน · Hall 1</h2><p class="muted" style="text-align:center">15 โต๊ะ · โต๊ะละ 10 ท่าน</p><div class="hall"><div class="stage">เวที / STAGE</div><div class="tables" id="tables"></div><div class="entrance">↑ ทางเข้า / ENTRANCE</div></div><div class="legend">โต๊ะที่พบจะเปลี่ยนเป็นสี Burgundy · แผนผังตัวอย่าง ปรับตำแหน่งได้</div></section><div class="footer">With love, B & P ♡</div></main><script>
// ปรับรายชื่อจริงที่ไฟล์ guests.csv: name,table (1-15)
const guestsUrl='guests.csv';let guests=[];const tableArea=document.getElementById('tables');const result=document.getElementById('result');const input=document.getElementById('guest');
// จัดเรียงแถวละ 3 โต๊ะ; เวทีอยู่ด้านบน
for(let n=1;n<=15;n++){const el=document.createElement('div');el.className='seat';el.id='table-'+n;el.textContent='โต๊ะ '+n;tableArea.appendChild(el)}
function csvParse(s){const lines=s.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());return lines.slice(1).map(line=>{let fields=[],v='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===','&&!quote){fields.push(v.trim());v=''}else v+=c}fields.push(v.trim());return {name:fields[0]||'',table:Number(fields[1])}}).filter(g=>g.name&&g.table>=1&&g.table<=15)}
fetch(guestsUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('csv');return r.text()}).then(s=>{guests=csvParse(s)}).catch(()=>{result.textContent='ไม่สามารถโหลดรายชื่อได้ กรุณาตรวจสอบไฟล์ guests.csv'});
function norm(s){return s.toLocaleLowerCase().replace(/\s+/g,'').trim()}
function find(){document.querySelectorAll('.seat').forEach(e=>e.classList.remove('active'));const q=norm(input.value);if(q.length<2){result.textContent='กรุณากรอกชื่ออย่างน้อย 2 ตัวอักษร';return}const exact=guests.filter(g=>norm(g.name)===q);const found=exact.length?exact:guests.filter(g=>norm(g.name).includes(q));result.replaceChildren();if(!found.length){result.textContent='ไม่พบรายชื่อ กรุณาตรวจสอบการสะกด หรือติดต่อโต๊ะลงทะเบียน';return}if(found.length>1){const msg=document.createElement('p');msg.textContent='พบหลายรายชื่อ กรุณาเลือกชื่อของคุณ:';result.appendChild(msg);found.slice(0,30).forEach(g=>{const b=document.createElement('button');b.textContent=g.name+' · โต๊ะ '+g.table;b.style.margin='4px';b.onclick=()=>show(g);result.appendChild(b)});return}show(found[0])}
function show(g){result.replaceChildren();const div=document.createElement('div');div.className='success';const a=document.createElement('div');a.textContent='ยินดีต้อนรับคุณ '+g.name;const b=document.createElement('div');b.className='table-num';b.textContent='โต๊ะหมายเลข '+g.table;const c=document.createElement('div');c.textContent='ดูโต๊ะที่ไฮไลต์บนแผนผังด้านล่าง';div.append(a,b,c);result.appendChild(div);document.querySelectorAll('.seat').forEach(e=>e.classList.remove('active'));const t=document.getElementById('table-'+g.table);t.classList.add('active');setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'center'}),100)}
document.getElementById('find').onclick=find;input.addEventListener('keydown',e=>{if(e.key==='Enter')find()});
</script></body></html>
